name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and domain tests
        run: npm test

      - name: Run exhaustive supported-range validation
        run: npm run test:exhaustive

      - name: Build production artifact
        run: npm run build

      - name: Validate release artifact
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run product and accessibility smoke tests
        run: npm run test:e2e

      - name: Preserve Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
